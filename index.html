<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Motor 2D - Trigonometría</title>
    <style>
        body { margin: 0; background-color: #1a1a1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        canvas { border: 2px solid #444; background: #050505; margin-top: 10px; cursor: crosshair; }
        .info { margin-top: 10px; width: 800px; display: flex; justify-content: space-between; font-size: 14px; }
    </style>
</head>
<body>
    <h2>Simulador de Línea de Visión (CAMPO DE VISÓN 2D)</h2>
    <canvas id="CajaCanvas" width="800" height="600"></canvas>
    <div class="info">
        <span>Controles: Mueve el mouse para apuntar | WASD para moverte</span>
        <span id="estado">Calculando...</span>
    </div>

<script>
const CajaCanvasJs = document.getElementById('CajaCanvas');
const ctx = CajaCanvasJs.getContext('2d');

// Configuración del Jugador
const jugador = {
    x: 400,
    y: 300,
    angulo: 0,          // Grados
    campoVision: 60,    // Apertura del cono de visión (FOV en grados)
    numRayos: 120,      // Cantidad de rayos trigonométricos
    distMax: 350        // Alcance máximo de la linterna en píxeles
};

// Obstáculos en el mundo (paredes)
const paredes = [
    { x: 150, y: 100, ancho: 100, alto: 150 },
    { x: 500, y: 150, ancho: 150, alto: 80 },
    { x: 300, y: 400, ancho: 200, alto: 100 }
];

// Detección de movimiento por teclado
const teclas = {};
window.addEventListener('keydown', e => teclas[e.key.toLowerCase()  ] = true);
window.addEventListener('keyup', e => teclas[e.key.toLowerCase()] = false);

// Apuntado con el mouse mediante Arcotangente (Trigonometría Inversa)
CajaCanvasJs.addEventListener('mousemove', e => {
    const rectangulo = CajaCanvasJs.getBoundingClientRect();
    const mouseX = e.clientX - rectangulo.left;
    const mouseY = e.clientY - rectangulo.top;
    
    // Cálculo de catetos hacia la posición del mouse
    const distanciaX = mouseX - jugador.x;
    const distanciaY = mouseY - jugador.y;
    
    // Conversión de arcotangente2 (radianes a grados)
    jugador.angulo = Math.atan2(distanciaY, distanciaX) * (180 / Math.PI);
});

// Función de conversión de grados sexagesimales a radianes
function gradosARadianes(grados) {
    return grados * (Math.PI / 180);
}

// Comprobación de colisión entre un punto y las paredes del mundo
function hayColision(x, y) {
    if (x < 0 || x > CajaCanvasJs.width || y < 0 || y > CajaCanvasJs.height) return true;
    for (let pared of paredes) {
        if (x >= pared.x && x <= pared.x + pared.ancho && y >= pared.y && y <= pared.y + pared.alto) {
            return true;
        }
    }
    return false;
}

// Ciclo Principal de Renderizado
function actualizar() {
    // Movimiento básico con teclas WASD
    if (teclas['w']) jugador.y -= 3;
    if (teclas['s']) jugador.y += 3;
    if (teclas['a']) jugador.x -= 3;
    if (teclas['d']) jugador.x += 3;

    // Limpieza de pantalla
    ctx.clearRect(0, 0, CajaCanvasJs.width, CajaCanvasJs.height);

    // Dibujar obstáculos (paredes)
    ctx.fillStyle = '#334455';
    paredes.forEach(pared => ctx.fillRect(pared.x, pared.y, pared.ancho, pared.alto));

    // LÓGICA DE RAYCASTING TRIGONOMÉTRICO
    const puntosRayos = [];
    const mitadFOV = jugador.campoVision / 2;
    const anguloInicio = jugador.angulo - mitadFOV;
    const pasoAngulo = jugador.campoVision / jugador.numRayos;

    for (let i = 0; i <= jugador.numRayos; i++) {
        const anguloActualGrados = anguloInicio + (i * pasoAngulo);
        const radianes = gradosARadianes(anguloActualGrados);
        
        // Proyección incremental mediante Catetos: cos(rad), sen(rad)
        const coseno = Math.cos(radianes);
        const seno = Math.sin(radianes);
        
        let rayoX = jugador.x;
        let rayoY = jugador.y;
        let distancia = 0;
        const pasoTamano = 2;

        while (distancia < jugador.distMax) {
            rayoX += coseno * pasoTamano;
            rayoY += seno * pasoTamano;
            distancia += pasoTamano;

            if (hayColision(rayoX, rayoY)) break;
        }
        puntosRayos.push({ x: rayoX, y: rayoY });
    }

    // Dibujar el Polígono de Luz (Campo de Visión)
    ctx.beginPath();
    ctx.moveTo(jugador.x, jugador.y);
    puntosRayos.forEach(punto => ctx.lineTo(punto.x, punto.y));
    ctx.closePath();
    ctx.fillStyle = 'rgba(255, 230, 150, 0.35)';
    ctx.fill();

    // Dibujar Líneas de Rayos individuales
    ctx.strokeStyle = 'rgba(255, 200, 50, 0.15)';
    ctx.beginPath();
    puntosRayos.forEach(punto => {
        ctx.moveTo(jugador.x, jugador.y);
        ctx.lineTo(punto.x, punto.y);
    });
    ctx.stroke();

    // Dibujar Jugador
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.arc(jugador.x, jugador.y, 8, 0, Math.PI * 2);
    ctx.fill();

    // Actualizar texto informativo de estado
    document.getElementById('estado').innerText = 
        `Pos: (${Math.round(jugador.x)}, ${Math.round(jugador.y)}) | Ángulo: ${Math.round(jugador.angulo)}°`;

    requestAnimationFrame(actualizar);
}

actualizar();
</script>
</body>
</html>
